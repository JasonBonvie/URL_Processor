[project]
name = "automated_sequential_batch_sustainability_classifier"
version = "0.1.0"
description = "Sustainability marketing classifier using CrewAI Flows"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools,anthropic]==1.9.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.28.0",
]

[project.scripts]
kickoff = "automated_sequential_batch_sustainability_classifier.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
