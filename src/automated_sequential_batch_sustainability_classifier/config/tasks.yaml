---
read_urls_from_onedrive_spreadsheet:
  description: |-
    Read URLs from the CLEAN_LEGACY_URL column in the specified Excel spreadsheet using multiple OneDrive access methods.

    Use the provided file path: {file_path} to locate and access the Excel spreadsheet. Try these approaches in order:

    1. **Direct path access**: Use get_file_by_path with the provided path
    2. **Search by filename**: Use search_files to find the file by name if path fails
    3. **List Excel workbooks**: Use get_workbooks to find Excel files
    4. **Browse directories**: Use list_files or list_files_by_path to navigate to the file
    5. **Recent files**: Check get_recent_files if it might be recently accessed

    Once you successfully locate and access the Excel file:
    - Identify the worksheet containing the CLEAN_LEGACY_URL column
    - Extract all URLs from that column, skipping empty cells
    - Return the URLs as a structured list for processing

    Handle any access issues gracefully and provide clear feedback about which method worked or what alternatives were tried.
  expected_output: A list of URLs extracted from the CLEAN_LEGACY_URL column of the
    specified Excel file, formatted as a numbered list. Include the file path used,
    total count of URLs found, and any notes about data quality or missing entries.
  agent: onedrive_data_manager
coordinate_batch_processing:
  description: "Coordinate processing of a SINGLE batch based on the batch_number
    input parameter.\n\n**SINGLE BATCH PROCESSING**:\n- Accept input parameter: {batch_number}
    (e.g., \"1\" for batch 1)\n- Process only the specified batch number\n- Track
    progress: \"Processing batch X of 10 total\"\n\n**BATCH DEFINITIONS** (10 URLs
    per batch):\n- Batch 1: URLs 1-10\n- Batch 2: URLs 11-20  \n- Batch 3: URLs 21-30\n-
    Batch 4: URLs 31-40\n- Batch 5: URLs 41-50\n- Batch 6: URLs 51-60\n- Batch 7:
    URLs 61-70\n- Batch 8: URLs 71-80\n- Batch 9: URLs 81-90\n- Batch 10: URLs 91-99\n\n**COORDINATION
    OUTPUT**: Provide the specific batch URLs to the scraping agent with clear instructions
    to process only the specified batch."
  expected_output: |-
    Single batch coordination completed:
    - Processed batch number: {batch_number}
    - URLs for batch {batch_number} provided to Web Content Scraper
    - Clear instruction: "Process ONLY batch {batch_number}"
    - Progress tracking: "Batch {batch_number} of 10 total"
    - Ready for focused scraping of specified batch
  agent: batch_processing_coordinator
  context:
  - read_urls_from_onedrive_spreadsheet
scrape_all_website_content_in_batches:
  description: |-
    Process a specific batch of URLs (10 URLs per batch) from the complete list of 99 URLs. This task focuses on processing ONE batch thoroughly.

    **BATCH PROCESSING APPROACH**:
    - Process the specific batch number provided by the coordinator
    - Each batch contains exactly 10 URLs (except batch 10 which has 9 URLs)
    - Scrape each URL using the Serper tool
    - Extract readable marketing content, ignore navigation/disclaimers
    - Handle access issues gracefully
    - Label each result clearly with its URL

    **BATCH SPECIFICATIONS**:
    - Batch 1: URLs 1-10
    - Batch 2: URLs 11-20
    - Batch 3: URLs 21-30
    - Batch 4: URLs 31-40
    - Batch 5: URLs 41-50
    - Batch 6: URLs 51-60
    - Batch 7: URLs 61-70
    - Batch 8: URLs 71-80
    - Batch 9: URLs 81-90
    - Batch 10: URLs 91-99 (9 URLs)

    **Expected output**: Scraped content for the specified batch, clearly organized and labeled.
  expected_output: |-
    Scraped content for batch {batch_number}, including:
    - Clear batch identification: "Completed Batch {batch_number}"
    - Content for each URL clearly labeled with its URL
    - Total URLs processed in this batch
    - Any access issues encountered
    - Ready for classification by the next agent
  agent: web_content_scraper
  context:
  - coordinate_batch_processing
classify_all_urls_for_sustainability_marketing:
  description: "Classify the scraped content from the specified batch to determine
    if sustainability is used as a marketing message.\n\n**BATCH PROCESSING**: \n-
    Focus on classifying ONLY the URLs from the current batch\n- Process each URL's
    scraped content individually\n- Apply consistent classification methodology\n\n**CLASSIFICATION
    CRITERIA**:\n- YES = sustainability is used as a marketing message or differentiator\n-
    NO = sustainability is absent, incidental, or purely technical\n\n**PERCENTAGE
    ATTRIBUTION** (for each URL):\n- If NO → sustainability_percentage = 0\n- If YES,
    assign percentage (0–100) representing sustainability's share of marketing emphasis:\n
    \ • 10–20%: Secondary supporting benefit\n  • 25–40%: Clear but not dominant differentiator
    \ \n  • 50–70%: Primary value proposition\n  • 80–100%: Core or sole marketing
    message\n\n**THEMES** (use only if explicit): Energy Efficiency; Carbon / Embodied
    Carbon; Green Certifications (LEED, BREEAM); Environmental Analysis Tools; Climate
    Resilience; Material Sustainability; Operational Emissions; Waste Reduction; Renewables
    / Clean Energy.\n\n**Expected output**: Classification results ONLY for the current
    batch URLs."
  expected_output: |-
    Classification results for batch {batch_number} in CSV format:
    - Format: url,sustainability_marketing,sustainability_percentage,confidence,themes,reason
    - Progress summary: "Classified Batch {batch_number}"
    - No CSV headers - just the data rows for this batch
    - Conservative scoring focused on explicit marketing messaging
    - Ready to combine with other batch results
  agent: sustainability_marketing_classifier
  context:
  - scrape_all_website_content_in_batches
save_results_to_onedrive_csv:
  description: "Save the COMPLETE classification results from ALL batches as a comprehensive
    CSV file to OneDrive.\n\n**COMPLETE DATASET REQUIREMENTS**:\n- Must include classification
    results for ALL 99 URLs (not just 12 from first batch)\n- Verify total count matches
    original URL list (99 URLs)\n- Combine results from all processing batches into
    single CSV\n- Ensure no URLs are missing from the final dataset\n\n**CSV STRUCTURE**:\nThe
    CSV should have the following columns in order:\n1. url (the URL that was analyzed)
    \n2. sustainability_marketing (YES/NO)\n3. sustainability_percentage (0-100)\n4.
    confidence (0.0-1.0)\n5. themes (array of themes)\n6. reason (explanation text)\n\n**VALIDATION
    CHECKS**:\n- Total URLs processed = 99 (matching original Excel file count)\n-
    No duplicate URLs unless they existed in original data\n- All required columns
    present with proper formatting\n- Text fields properly quoted for CSV compatibility\n\nCreate
    the CSV with headers and save it to OneDrive with filename: {output_filename}
    or use \"sustainability_classification_results_[YYYY-MM-DD].csv\".\n\n**CRITICAL
    SUCCESS CRITERIA**: Final CSV must contain ALL 99 URLs with their classification
    results, proving complete processing of the entire dataset."
  expected_output: |-
    CSV file successfully uploaded to OneDrive containing:
    - ALL 99 classification results (complete dataset)
    - Proper CSV formatting with headers
    - File path confirmation and upload status
    - Summary: "Successfully saved 99/99 URLs to [filename]"
    - Verification that no URLs were missed in the final dataset
  agent: onedrive_data_manager
  context:
  - classify_all_urls_for_sustainability_marketing
